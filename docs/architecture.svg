<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="600" fill="#1b1f23">OneCommerce, one resource group</text>
  <text x="40" y="70" font-size="14" fill="#57606a">Deployed by main.bicep and its three modules</text>

  <rect x="24" y="88" width="932" height="446" rx="10" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- App Service -->
  <text x="48" y="118" font-size="13" font-weight="600" fill="#57606a" letter-spacing="0.6">APP SERVICE</text>

  <rect x="48" y="130" width="300" height="150" rx="8" fill="#eef4fb" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="66" y="154" font-size="14" font-weight="600" fill="#1b1f23">sp-OneCommerce-plan-1</text>
  <rect x="66" y="168" width="264" height="42" rx="6" fill="#ffffff" stroke="#4a7fb5"/>
  <text x="80" y="194" font-size="13" fill="#1b1f23">webapp-OneCommerceMVC-xxxx</text>
  <rect x="66" y="220" width="264" height="42" rx="6" fill="#ffffff" stroke="#4a7fb5"/>
  <text x="80" y="246" font-size="13" fill="#1b1f23">webapp-OneProduitAPI-xxxx</text>

  <rect x="48" y="300" width="300" height="202" rx="8" fill="#eef4fb" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="66" y="324" font-size="14" font-weight="600" fill="#1b1f23">sp-OneCommerce-plan-2</text>
  <rect x="66" y="338" width="264" height="42" rx="6" fill="#ffffff" stroke="#4a7fb5"/>
  <text x="80" y="364" font-size="13" fill="#1b1f23">webapp-OneFichiersAPI-xxxx</text>
  <rect x="66" y="390" width="264" height="42" rx="6" fill="#ffffff" stroke="#4a7fb5"/>
  <text x="80" y="416" font-size="13" fill="#1b1f23">webapp-OneCommandesAPI-xxxx</text>
  <rect x="66" y="442" width="264" height="42" rx="6" fill="#ffffff" stroke="#4a7fb5"/>
  <text x="80" y="468" font-size="13" fill="#1b1f23">webapp-OneFideliteAPI-xxxx</text>

  <!-- SQL -->
  <text x="390" y="118" font-size="13" font-weight="600" fill="#57606a" letter-spacing="0.6">AZURE SQL</text>

  <rect x="390" y="130" width="276" height="282" rx="8" fill="#f1f0f9" stroke="#6b5fae" stroke-width="1.5"/>
  <text x="408" y="154" font-size="14" font-weight="600" fill="#1b1f23">srv-onecommerce</text>
  <text x="408" y="174" font-size="12" fill="#57606a">TLS 1.2, one allowed address range</text>

  <rect x="408" y="188" width="240" height="206" rx="6" fill="#ffffff" stroke="#6b5fae"/>
  <text x="424" y="212" font-size="13" font-weight="600" fill="#1b1f23">pool-onecommerce</text>
  <text x="424" y="230" font-size="12" fill="#57606a">Standard, 200 DTU, 50 to 200 each</text>
  <rect x="424" y="244" width="208" height="38" rx="5" fill="#f6f5fc" stroke="#6b5fae"/>
  <text x="438" y="268" font-size="13" fill="#1b1f23">db-Produits</text>
  <rect x="424" y="292" width="208" height="38" rx="5" fill="#f6f5fc" stroke="#6b5fae"/>
  <text x="438" y="316" font-size="13" fill="#1b1f23">db-Commandes</text>
  <rect x="424" y="340" width="208" height="38" rx="5" fill="#f6f5fc" stroke="#6b5fae"/>
  <text x="438" y="364" font-size="13" fill="#1b1f23">db-Fidelite</text>

  <!-- Storage -->
  <text x="708" y="118" font-size="13" font-weight="600" fill="#57606a" letter-spacing="0.6">STORAGE</text>

  <rect x="708" y="130" width="224" height="206" rx="8" fill="#edf6f1" stroke="#3f8f6b" stroke-width="1.5"/>
  <text x="726" y="154" font-size="14" font-weight="600" fill="#1b1f23">stone&#8230;</text>
  <text x="726" y="174" font-size="12" fill="#57606a">RA-GRS, HTTPS only</text>
  <text x="726" y="192" font-size="12" fill="#57606a">no public blob access</text>

  <rect x="726" y="206" width="188" height="48" rx="6" fill="#ffffff" stroke="#3f8f6b"/>
  <text x="740" y="226" font-size="13" fill="#1b1f23">images</text>
  <text x="740" y="244" font-size="12" fill="#57606a">private container</text>

  <rect x="726" y="264" width="188" height="48" rx="6" fill="#ffffff" stroke="#3f8f6b"/>
  <text x="740" y="284" font-size="13" fill="#1b1f23">q-commande</text>
  <text x="740" y="302" font-size="12" fill="#57606a">queue</text>

  <!-- Arrows -->
  <defs>
    <marker id="tete" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8c959f"/>
    </marker>
  </defs>
  <line x1="348" y1="241" x2="388" y2="241" stroke="#8c959f" stroke-width="1.5" marker-end="url(#tete)"/>
  <line x1="348" y1="361" x2="388" y2="300" stroke="#8c959f" stroke-width="1.5" marker-end="url(#tete)"/>

  <text x="708" y="362" font-size="12" fill="#57606a">Written by webapp-OneFichiersAPI</text>
  <text x="708" y="392" font-size="12" fill="#57606a">Every resource carries</text>
  <text x="708" y="410" font-size="12" fill="#57606a">Application = &#8220;OneCommerce&#8221;</text>

  <rect x="390" y="440" width="542" height="62" rx="8" fill="#fbf6ec" stroke="#b08a3e" stroke-width="1.5"/>
  <text x="408" y="464" font-size="13" font-weight="600" fill="#1b1f23">Dev runs on F1, Test on B1, Prod on S1</text>
  <text x="408" y="484" font-size="12.5" fill="#57606a">Prod alone adds a staging slot to each application and an autoscale rule on the plan</text>

  <text x="40" y="568" font-size="12" fill="#8c959f">Names ending in xxxx carry four characters derived from the resource group, so a second deployment keeps the same names</text>
</svg>
